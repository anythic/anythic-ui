name: Release

on:
  push:
    branches: [main]
  # Lets a maintainer re-run tagging and releasing by hand.
  workflow_dispatch:

# One release at a time, and never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version Packages" pull request
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, so releases can tag the commit that set a version.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # pnpm hands the upload to the npm CLI, and trusted publishing needs
      # npm 11.5.1 or later; Node 22 ships npm 10. (npm 12 needs a newer Node 22.)
      - run: npm install --global npm@11
      # With pending changesets, this opens or updates a "Version Packages"
      # pull request. Merging that pull request runs this again with no
      # changesets left, and then it publishes to npm. Publishing uses npm
      # trusted publishing: npm accepts this workflow by its OIDC identity,
      # so no npm token is stored anywhere.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and release the published version
        run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
