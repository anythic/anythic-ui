name: Release

on:
  push:
    branches: [main]

# One release at a time, and never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version Packages" pull request
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # With pending changesets, this opens or updates a "Version Packages"
      # pull request. Merging that pull request runs this again with no
      # changesets left, and then it publishes to npm.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
